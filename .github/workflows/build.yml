name: Build Paint AutoDrawer 256

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained EXE
        run: dotnet publish PaintAutoDrawer256.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PaintAutoDrawer256-win-x64
          path: bin/Release/net8.0-windows/win-x64/publish/PaintAutoDrawer256.exe
